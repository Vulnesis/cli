version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    # Match the package firewall's 3-day cooldown: younger releases are
    # refused (425 Too Early), so their PRs cannot be built through it.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 3

  # Its own entry: Dependabot cannot read a $/ local action, so an update under the root
  # fails, and in one entry that took the pins down with it.
  - package-ecosystem: github-actions
    directory: "/tools/actiongen/pins"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    # These workflows call this repository's own actions as `uses: $/<dir>`.
    # Dependabot checks out only .github, so it cannot read <dir>/action.yml and
    # every update touching them ended in dependency_file_not_resolvable, which
    # failed the whole run. Their third-party pins are major tags in the lock.
    exclude-paths:
      - ".github/workflows/test.yml"
      - ".github/workflows/actions-e2e.yml"
      - ".github/workflows/scope-union.yml"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
